[package]
name = "paradise-code"
version = "0.3.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
libc = "0.2"
url = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
