name: Native platform builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      PUPPETEER_SKIP_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxkbfile-dev libsecret-1-dev libkrb5-dev xvfb
      - name: Build and validate bundled native modules
        run: python scripts/build-platform.py
      - name: Runtime smoke test
        shell: bash
        run: node --test tests/platform-smoke.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paradise-${{ runner.os }}
          path: |
            target/release/bundle/
            platform-smoke.json
          if-no-files-found: warn
